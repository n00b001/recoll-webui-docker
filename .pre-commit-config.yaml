# Pre-commit hooks for recoll-webui-docker
# Install with: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # Ruff - fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix, --show-fixes]
        types_or: [python, pyi]
        exclude: ^recoll-webui/
      - id: ruff-format
        name: ruff format
        types_or: [python, pyi]
        exclude: ^recoll-webui/

  # Ty - fast Python type checker
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.72
    hooks:
      - id: ty
        name: ty check
        types: [python]
        exclude: ^(recoll-webui/|\.claude/worktrees/)
        args: [--project=recoll_wrapper]

  # Pre-push hooks (run tests before push)
  - repo: local
    hooks:
      - id: pytest-pre-push
        name: pytest (pre-push)
        entry: uv run pytest -x -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        types: [python]