repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd recoll_wrapper && uv run ruff check --fix . && cd ../sms-processor && uv run ruff check --fix .'
        language: system
        pass_filenames: false
        always_run: true
      - id: ty-check
        name: ty check
        entry: bash -c 'cd recoll_wrapper && uv run ty check . --exclude recoll-webui --exclude src && cd ../sms-processor && uv run ty check .'
        language: system
        pass_filenames: false
        always_run: true
      - id: whatsapp-test
        name: whatsapp-archiver tests
        entry: bash -c 'cd whatsapp-archiver && npm test'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: recoll-test
        name: recoll_wrapper tests
        entry: bash -c 'cd recoll_wrapper && uv run pytest -v'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: sms-test
        name: sms-processor tests
        entry: bash -c 'cd sms-processor && uv run pytest -v'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.96.0
    hooks:
      - id: trufflehog
