# =============================================================================
# Unified Search Infrastructure — Docker Compose
# =============================================================================
# Services:
#   recoll-engine           — Document/image/audio indexer (OCR, EXIF, metadata)
#   recoll-webui            — Recoll web search interface
#   recoll-audio-worker     — Audio/video transcription (whisper.cpp → .txt transcripts)
#   immich-server           — Photo/video management with ML search
#   immich-machine-learning — Immich ML backend (face recognition, CLIP tags)
#   mbsync                  — IMAP → Maildir sync (for Recoll email indexing)
#   whatsapp-archiver       — WhatsApp message/media export (Baileys multi-device client)
#   sms-processor           — SMS/RCS backup → markdown organizer (SMS Backup & Restore XML)
#
# Shared network: search-infrastructure
# All services communicate internally; only web UIs are published.
# =============================================================================

networks:
  search-infrastructure:
    driver: bridge

volumes:
  immich-redis-data:
  recoll-audio-data:

# ---------------------------------------------------------------------------
# Constants — YAML anchors for DRY path references
# Edit the path here once, reuse everywhere via *alias
# ---------------------------------------------------------------------------
x-constants:
  shuttle: &shuttle /mnt/shuttle/share
  app-data: &app-data /mnt/shuttle/share/app-data
  syncthing: &syncthing /mnt/shuttle/share/syncthing
  alex-home: &alex-home /mnt/shuttle/share/alex-home
  chloe-home: &chloe-home /mnt/shuttle/share/chloe-home
  recoll-data: &recoll-data /mnt/shuttle/share/app-data/recoll
  immich-data: &immich-data /mnt/shuttle/share/app-data/immich
  # mbsync: config (mbsync.rc) and data (Maildir tree)
  mbsync-config: &mbsync-config /mnt/shuttle/share/app-data/mbsync/config
  mbsync-data: &mbsync-data /mnt/shuttle/share/app-data/mbsync/data
  # whatsapp: config (Baileys sessions) and data (chats, media exports)
  whatsapp-config: &whatsapp-config /mnt/shuttle/share/app-data/whatsapp/config
  whatsapp-data: &whatsapp-data /mnt/shuttle/share/app-data/whatsapp/data
  # sms-processor: organized SMS/RCS messages (output indexed by Recoll)
  sms-data: &sms-data /mnt/shuttle/share/app-data/sms-organized
  alex-hades: &alex-hades /mnt/shuttle/share/syncthing/alex-hades-home
  alex-phone: &alex-phone /mnt/shuttle/share/syncthing/alex-phone
  alex-gdrive: &alex-gdrive /mnt/shuttle/share/alex-home/google-drive
  alex-gphotos: &alex-gphotos /mnt/shuttle/share/alex-home/google-photos
  chloe-home-sync: &chloe-home-sync /mnt/shuttle/share/syncthing/chloe-home
  chloe-phone: &chloe-phone /mnt/shuttle/share/syncthing/chloe-phone
  chloe-gdrive: &chloe-gdrive /mnt/shuttle/share/chloe-home/google-drive
  chloe-gphotos: &chloe-gphotos /mnt/shuttle/share/chloe-home/google-photos

services:
  # ========================================================================
  # RECOLL — Document, Image, Audio Search Engine
  # ========================================================================

  recoll-engine:
    container_name: recoll-engine
    image: ghcr.io/n00b001/recoll-engine:latest
    restart: unless-stopped
    networks:
      - search-infrastructure
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
    volumes:
      - type: bind
        source: *recoll-data
        target: /root
      - type: bind
        source: ./recoll.conf
        target: /root/.recoll/recoll.conf
        read_only: true
      # Alex
      - type: bind
        source: *alex-hades
        target: /homes/alex/hades
        read_only: true
      - type: bind
        source: *alex-phone
        target: /homes/alex/phone
        read_only: true
      - type: bind
        source: *alex-gdrive
        target: /homes/alex/gdrive
        read_only: true
      - type: bind
        source: *alex-gphotos
        target: /homes/alex/gphotos
        read_only: true
      # Chloe
      - type: bind
        source: *chloe-home-sync
        target: /homes/chloe/home
        read_only: true
      - type: bind
        source: *chloe-phone
        target: /homes/chloe/phone
        read_only: true
      - type: bind
        source: *chloe-gdrive
        target: /homes/chloe/gdrive
        read_only: true
      - type: bind
        source: *chloe-gphotos
        target: /homes/chloe/gphotos
        read_only: true
      # Synced email (Maildir tree from mbsync)
      - type: bind
        source: *mbsync-data
        target: /homes/mail
        read_only: true
      # WhatsApp exported chats and media
      - type: bind
        source: *whatsapp-data
        target: /homes/whatsapp
        read_only: true
      # SMS/RCS organized messages (from sms-processor)
      - type: bind
        source: *sms-data
        target: /homes/sms
        read_only: true
      # Audio/video transcripts (from recoll-audio-worker)
      - type: volume
        source: recoll-audio-data
        target: /homes/transcripts
        read_only: true
    command:
      - recollindex

  recoll-webui:
    container_name: recoll-webui
    image: ghcr.io/n00b001/recoll-webui:latest
    restart: unless-stopped
    networks:
      - search-infrastructure
    ports:
      - '9080:8080'
    depends_on:
      - recoll-engine
    volumes:
      - type: bind
        source: *recoll-data
        target: /root

  # ========================================================================
  # IMMICH — Photo/Video Management with ML Search
  # ========================================================================

  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v1.126.0
    restart: unless-stopped
    networks:
      - search-infrastructure
    ports:
      - '2283:3001'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4096M
    devices:
      - /dev/dri:/dev/dri
    environment:
      NODE_ENV: production
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: ${IMMICH_DB_USER:-immich}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:-}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:-immich}
      DB_PORT: '5432'
      REDIS_HOSTNAME: immich-redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${IMMICH_REDIS_PASSWORD:-}
      REDIS_DBINDEX: '0'
      IMMICH_MACHINE_LEARNING_ENABLED: 'true'
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: *immich-data
        target: /upload
      # Google Photos imports
      - type: bind
        source: *alex-gphotos
        target: /data/gphotos-alex
        read_only: true
      - type: bind
        source: *chloe-gphotos
        target: /data/gphotos-chloe
        read_only: true
      # Google Drive
      - type: bind
        source: *alex-gdrive
        target: /data/gdrive-alex
        read_only: true
      - type: bind
        source: *chloe-gdrive
        target: /data/gdrive-chloe
        read_only: true
      # Syncthing
      - type: bind
        source: *alex-hades
        target: /data/sync-alex-home
        read_only: true
      - type: bind
        source: *alex-phone
        target: /data/sync-alex-phone
        read_only: true
      - type: bind
        source: *chloe-home-sync
        target: /data/sync-chloe-home
        read_only: true
      - type: bind
        source: *chloe-phone
        target: /data/sync-chloe-phone
        read_only: true
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(\"http\").get(\"http://localhost:3001/api/server-info/ping\", r => { process.exit(r.statusCode === 200 ? 0 : 1) })" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    group_add:
      - '44'
      - '107'

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v1.126.0
    restart: unless-stopped
    networks:
      - search-infrastructure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4096M
    devices:
      - /dev/dri:/dev/dri
    environment:
      NODE_ENV: production
      IMMICH_PORT: '3003'
      HF_HOME: /mlcache
    volumes:
      - type: bind
        source: *immich-data
        target: /model-cache
    group_add:
      - '44'
      - '107'

  immich-postgres:
    container_name: immich-postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    restart: unless-stopped
    networks:
      - search-infrastructure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4096M
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:-}
      POSTGRES_USER: ${IMMICH_DB_USER:-immich}
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
    volumes:
      - type: bind
        source: *immich-data
        target: /pg_data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    shm_size: 256M
    stop_grace_period: 60s

  immich-redis:
    container_name: immich-redis
    image: redis:7.2-alpine
    restart: unless-stopped
    networks:
      - search-infrastructure
    command: ['--requirepass', '${IMMICH_REDIS_PASSWORD:-}']
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    volumes:
      - immich-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${IMMICH_REDIS_PASSWORD:-}', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ========================================================================
  # MBSYNC — IMAP → Maildir Sync (for Recoll email indexing)
  # ========================================================================
  # mbsync syncs IMAP mailboxes to a local Maildir tree.
  # Recoll indexes the Maildir directory as individual .eml files.
  # Runs via cron (default: every 5 minutes).
  #
  # Config: app-data/mbsync/config/ — mbsync.rc (isync format, mounted read-only)
  # Data:   app-data/mbsync/data/   — Maildir tree (synced emails)
  # Output: mbsync/data/INBOX/new/*.eml → Recoll indexes /homes/mail/
  #
  # Image: ghcr.io/jakewharton/mbsync (JakeWharton/docker-mbsync)
  # Config file must be named mbsync.rc and placed in the config volume.
  # ========================================================================

  mbsync:
    container_name: mbsync
    image: ghcr.io/jakewharton/mbsync:latest
    restart: unless-stopped
    networks:
      - search-infrastructure
    volumes:
      # Application config directory — mbsync.rc mounted read-only
      - type: bind
        source: *mbsync-config
        target: /config
        read_only: true
      # Data directory — Maildir tree where synced emails live
      - type: bind
        source: *mbsync-data
        target: /mail
    environment:
      # Run every 5 minutes
      CRON: '*/5 * * * *'
      # Optional: set PUID/PGID to write mail as a specific user/group
      # PUID: '1000'
      # PGID: '1000'
      # Optional: healthchecks.io integration
      # HEALTHCHECK_ID: '<your-check-id>'
    # No ports exposed — background sync only
    # Config file: app-data/mbsync/config/mbsync.rc (isync format)
    # Mail data:   app-data/mbsync/data/               (Maildir tree)

  # ========================================================================
  # WHATSAPP ARCHIVER — Baileys-based message and media export
  # ========================================================================
  # Connects as a WhatsApp Web multi-device client. Scans QR once, then
  # continuously exports incoming messages to plain-text files and downloads
  # all attachments (photos, audio, video, documents) to dated folders.
  #
  # Config: app-data/whatsapp/config/ — Baileys sessions (auth state)
  # Data:   app-data/whatsapp/data/   — chats/*.txt, media/{type}/YYYY-MM/
  # Recoll indexes /homes/whatsapp/ (the data volume mounted read-only).
  # ========================================================================

  whatsapp-archiver:
    container_name: whatsapp-archiver
    image: ghcr.io/n00b001/whatsapp-archiver:latest
    restart: unless-stopped
    networks:
      - search-infrastructure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    environment:
      SESSION_DIR: /config/sessions
      DATA_DIR: /data
      ACCOUNT_NAME: ${WHATSAPP_ACCOUNT_NAME:-default}
      LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-info}
    volumes:
      # Application config — Baileys auth state (persistent session)
      - type: bind
        source: *whatsapp-config
        target: /config
      # Data — exported chats and media
      - type: bind
        source: *whatsapp-data
        target: /data

  # ========================================================================
  # SMS/RCS PROCESSOR — SMS Backup & Restore XML → organized markdown
  # ========================================================================
  # Reads XML backup files produced by SMS Backup & Restore (Android app).
 # Backups land in Google Drive → synced to TrueNAS via rclone/GDrive sync.
 # Processor parses XML and writes per-contact markdown files organized by
 # phone number, ready for Recoll full-text search indexing.
  #
  # Input:  <google-drive>/SMS-RCS/*.xml  (SMS Backup & Restore exports)
  # Output: app-data/sms-organized/<user>/<contact>.md
  # Recoll indexes /homes/sms/ (the output volume mounted read-only).
  # ========================================================================

  sms-processor:
    container_name: sms-processor
    build: ./sms-processor
    restart: unless-stopped
    networks:
      - search-infrastructure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    environment:
      POLL_INTERVAL: ${SMS_POLL_INTERVAL:-300}
    volumes:
      # Input — SMS Backup & Restore XML files from Google Drive
      - type: bind
        source: *alex-gdrive
        target: /input
        read_only: true
      # Output — organized markdown (persisted across restarts)
      - type: bind
        source: *sms-data
        target: /output
    # Input is /input/SMS-RCS (Google Drive SMS Backup & Restore folder)
    # Output is /output (organized markdown files)
    # Poll interval: ${SMS_POLL_INTERVAL:-300} seconds
    command: ['python', 'process.py', '/input/SMS-RCS', '/output', '${SMS_POLL_INTERVAL:-300}']

  # ========================================================================
  # AUDIO/VIDEO TRANSCRIPTION — whisper.cpp → plain-text transcripts
  # ========================================================================
  # Polls input directories for audio and video files, transcribes them to
  # plain-text transcripts using whisper.cpp. Recoll indexes the .txt files.
  #
  # Input:  /input/<source>/ (audio/video files from phone, home, WhatsApp)
  # Output: recoll-audio-data volume → mounted as /homes/transcripts/ in recoll-engine
  # Model:  downloaded at startup from HuggingFace based on WHISPER_MODEL env var
  # ========================================================================

  recoll-audio-worker:
    container_name: recoll-audio-worker
    build: ./recoll-audio-worker
    restart: unless-stopped
    networks:
      - search-infrastructure
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    environment:
      POLL_INTERVAL: ${AUDIO_POLL_INTERVAL:-300}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
    volumes:
      # Input — audio/video files from various sources (read-only)
      - type: bind
        source: *alex-phone
        target: /input/alex-phone
        read_only: true
      - type: bind
        source: *chloe-phone
        target: /input/chloe-phone
        read_only: true
      - type: bind
        source: *alex-hades
        target: /input/alex-hades
        read_only: true
      - type: bind
        source: *chloe-home-sync
        target: /input/chloe-home
        read_only: true
      - type: bind
        source: *alex-gdrive
        target: /input/alex-gdrive
        read_only: true
      - type: bind
        source: *chloe-gdrive
        target: /input/chloe-gdrive
        read_only: true
      - type: bind
        source: *whatsapp-data
        target: /input/whatsapp
        read_only: true
      # Output — transcripts (persisted across restarts)
      - type: volume
        source: recoll-audio-data
        target: /output

