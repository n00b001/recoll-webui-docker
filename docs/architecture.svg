<!-- @dsCard group="architecture" -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxRecoll" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="boxImmich" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="boxMail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boxWA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="boxSMS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="boxStorage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boxUI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <style>
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .flow1 { animation: flowDash 3s linear infinite; }
      .flow2 { animation: flowDash 3s linear infinite 0.5s; }
      .flow3 { animation: flowDash 3s linear infinite 1s; }
      .flow4 { animation: flowDash 3s linear infinite 1.5s; }
      .flow5 { animation: flowDash 3s linear infinite 2s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      .label { font-size: 13px; fill: #e2e8f0; font-weight: 600; }
      .sublabel { font-size: 11px; fill: #94a3b8; }
      .title { font-size: 20px; fill: #f1f5f9; font-weight: 700; text-anchor: middle; }
      .badge { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" class="title">Unified Search Infrastructure</text>
  <text x="450" y="56" font-size="12" fill="#94a3b8" text-anchor="middle">Dockerized personal search across documents, photos, email, and messages</text>

  <!-- Animated connection lines: UI → Services -->
  <line x1="320" y1="120" x2="160" y2="165" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4" class="flow1"/>
  <line x1="400" y1="120" x2="395" y2="165" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8,4" class="flow2"/>
  <line x1="470" y1="120" x2="630" y2="165" stroke="#10b981" stroke-width="2" stroke-dasharray="8,4" class="flow3"/>
  <line x1="540" y1="120" x2="790" y2="260" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4" class="flow4"/>
  <line x1="600" y1="120" x2="790" y2="355" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4" class="flow5"/>

  <!-- Animated connection lines: Services → Storage -->
  <line x1="160" y1="245" x2="160" y2="430" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,4" class="flow1" opacity="0.5"/>
  <line x1="395" y1="245" x2="350" y2="430" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,4" class="flow2" opacity="0.5"/>
  <line x1="630" y1="245" x2="540" y2="430" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4" class="flow3" opacity="0.5"/>
  <line x1="790" y1="325" x2="700" y2="430" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,4" class="flow4" opacity="0.5"/>
  <line x1="790" y1="410" x2="750" y2="430" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" class="flow5" opacity="0.5"/>

  <!-- Future Unified UI Box -->
  <rect x="260" y="80" width="400" height="40" rx="8" fill="url(#boxUI)" opacity="0.15" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="105" font-size="13" fill="#a5b4fc" text-anchor="middle" font-weight="600">🔮 Future: Unified Search UI</text>

  <!-- Service Boxes Row 1 -->
  <!-- Recoll -->
  <rect x="70" y="165" width="180" height="80" rx="10" fill="url(#boxRecoll)" filter="url(#shadow)" opacity="0.9"/>
  <text x="160" y="192" class="label">📄 Recoll</text>
  <text x="160" y="210" class="sublabel">Documents · Images · OCR</text>
  <text x="160" y="228" class="sublabel">Port 9080</text>
  <rect x="75" y="170" width="40" height="14" rx="3" fill="#10b981"/>
  <text x="95" y="180" class="badge" fill="#fff">DONE</text>

  <!-- Immich -->
  <rect x="305" y="165" width="180" height="80" rx="10" fill="url(#boxImmich)" filter="url(#shadow)" opacity="0.9"/>
  <text x="395" y="192" class="label">📸 Immich</text>
  <text x="395" y="210" class="sublabel">Photos · Videos · ML Tags</text>
  <text x="395" y="228" class="sublabel">Port 2283</text>
  <rect x="310" y="170" width="40" height="14" rx="3" fill="#10b981"/>
  <text x="330" y="180" class="badge" fill="#fff">DONE</text>

  <!-- mbsync -->
  <rect x="540" y="165" width="180" height="80" rx="10" fill="url(#boxMail)" filter="url(#shadow)" opacity="0.9"/>
  <text x="630" y="192" class="label">📧 mbsync</text>
  <text x="630" y="210" class="sublabel">IMAP → Maildir every 5 min</text>
  <text x="630" y="228" class="sublabel">No web UI</text>
  <rect x="545" y="170" width="40" height="14" rx="3" fill="#10b981"/>
  <text x="565" y="180" class="badge" fill="#fff">DONE</text>

  <!-- WhatsApp Archiver -->
  <rect x="700" y="260" width="180" height="80" rx="10" fill="url(#boxWA)" filter="url(#shadow)" opacity="0.9"/>
  <text x="790" y="287" class="label">💬 WhatsApp Archiver</text>
  <text x="790" y="305" class="sublabel">Baileys MD · Chats · Media</text>
  <text x="790" y="323" class="sublabel">Auto-export to text</text>
  <rect x="705" y="265" width="40" height="14" rx="3" fill="#10b981"/>
  <text x="725" y="275" class="badge" fill="#fff">DONE</text>

  <!-- SMS Processor -->
  <rect x="700" y="355" width="180" height="80" rx="10" fill="url(#boxSMS)" filter="url(#shadow)" opacity="0.9"/>
  <text x="790" y="382" class="label">📱 SMS Processor</text>
  <text x="790" y="400" class="sublabel">XML Backup → Markdown</text>
  <text x="790" y="418" class="sublabel">Per-contact organization</text>
  <rect x="705" y="360" width="40" height="14" rx="3" fill="#10b981"/>
  <text x="725" y="370" class="badge" fill="#fff">DONE</text>

  <!-- Audio Worker -->
  <rect x="700" y="450" width="180" height="60" rx="10" fill="#334155" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="790" y="475" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="600">🎙 Audio Worker</text>
  <text x="790" y="493" class="sublabel">Whisper transcription (WIP)</text>
  <rect x="705" y="455" width="50" height="14" rx="3" fill="#f59e0b"/>
  <text x="730" y="465" class="badge" fill="#000">WIP</text>

  <!-- Storage Layer -->
  <rect x="100" y="430" width="700" height="70" rx="10" fill="url(#boxStorage)" filter="url(#shadow)"/>
  <text x="450" y="458" class="label">💾 Persistent Storage</text>
  <text x="450" y="478" class="sublabel">TrueNAS · Docker Volumes · SyncThing</text>
  <text x="450" y="494" class="sublabel">recoll index · immich data · maildir · whatsapp exports · sms markdown</text>

  <!-- Legend -->
  <circle cx="60" y="540" r="5" fill="#10b981"/>
  <text x="72" y="544" font-size="11" fill="#94a3b8">Implemented</text>
  <rect x="180" y="535" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="198" y="544" font-size="11" fill="#94a3b8">In Progress</text>
  <line x1="300" y1="540" x2="320" y2="540" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="328" y="544" font-size="11" fill="#94a3b8">Planned</text>

  <!-- Animated dots on flow lines -->
  <circle r="3" fill="#60a5fa" class="pulse" style="animation-delay:0s">
    <animateMotion dur="3s" repeatCount="indefinite" path="M320,120 L160,165"/>
  </circle>
  <circle r="3" fill="#a78bfa" class="pulse" style="animation-delay:0.5s">
    <animateMotion dur="3s" repeatCount="indefinite" path="M400,120 L395,165"/>
  </circle>
  <circle r="3" fill="#34d399" class="pulse" style="animation-delay:1s">
    <animateMotion dur="3s" repeatCount="indefinite" path="M470,120 L630,165"/>
  </circle>
  <circle r="3" fill="#4ade80" class="pulse" style="animation-delay:1.5s">
    <animateMotion dur="3s" repeatCount="indefinite" path="M540,120 L790,260"/>
  </circle>
  <circle r="3" fill="#fbbf24" class="pulse" style="animation-delay:2s">
    <animateMotion dur="3s" repeatCount="indefinite" path="M600,120 L790,355"/>
  </circle>
</svg>
