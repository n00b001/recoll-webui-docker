name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint — ruff (recoll_wrapper)
        run: cd recoll_wrapper && uv run ruff check .

      - name: Lint — ruff (sms-processor)
        run: cd sms-processor && uv run ruff check .

      - name: Type check — ty
        run: cd recoll_wrapper && uv run ty check . --exclude recoll-webui --exclude src

      - name: Validate Dockerfiles exist
        run: |
          for f in Dockerfile recoll-engine/Dockerfile recoll-audio-worker/Dockerfile whatsapp-archiver/Dockerfile sms-processor/Dockerfile; do
            test -f "$f" || { echo "FAIL: $f not found"; exit 1; }
          done

      - name: Lint — Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Lint — GitHub Actions
        uses: rhysd/actionlint@v1.7.12
        with:
          shell: sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan — TruffleHog
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified,unverified

  test:
    runs-on: ubuntu-latest
    needs: [lint, secrets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Python tests (recoll_wrapper) ----
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Recoll wrapper — tests + coverage (80%)
        run: cd recoll_wrapper && uv run pytest -v

      # ---- JavaScript tests (whatsapp-archiver) ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whatsapp-archiver/package-lock.json

      - name: WhatsApp archiver — install deps
        working-directory: whatsapp-archiver
        run: npm ci

      - name: WhatsApp archiver — tests + coverage (80%)
        working-directory: whatsapp-archiver
        run: npm test

      # ---- Python tests (sms-processor) ----
      - name: SMS processor — tests
        run: cd sms-processor && uv run pytest -v

  hadolint:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint — Dockerfile
        id: hl-root
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          output-file: hadolint-root.txt
          no-color: true
          no-fail: true

      - name: Lint — recoll-engine/Dockerfile
        id: hl-engine
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: recoll-engine/Dockerfile
          output-file: hadolint-engine.txt
          no-color: true
          no-fail: true

      - name: Lint — recoll-audio-worker/Dockerfile
        id: hl-audio
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: recoll-audio-worker/Dockerfile
          output-file: hadolint-audio.txt
          no-color: true
          no-fail: true

      - name: Lint — whatsapp-archiver/Dockerfile
        id: hl-whatsapp
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: whatsapp-archiver/Dockerfile
          output-file: hadolint-whatsapp.txt
          no-color: true
          no-fail: true

      - name: Lint — sms-processor/Dockerfile
        id: hl-sms
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: sms-processor/Dockerfile
          output-file: hadolint-sms.txt
          no-color: true
          no-fail: true

      - name: Combine results
        id: combine
        run: |
          show_result() {
            local title="$1" file="$2"
            echo "### $title"
            echo '```'
            if [ -s "$file" ]; then
              cat "$file"
            else
              echo "No issues found."
            fi
            echo ''
            echo '```'
            echo ""
          }
          {
            show_result "Dockerfile" hadolint-root.txt
            show_result "recoll-engine/Dockerfile" hadolint-engine.txt
            show_result "recoll-audio-worker/Dockerfile" hadolint-audio.txt
            show_result "whatsapp-archiver/Dockerfile" hadolint-whatsapp.txt
            show_result "sms-processor/Dockerfile" hadolint-sms.txt
          } > hadolint-results.md
          echo "results=$(base64 -w0 < hadolint-results.md)" >> "$GITHUB_OUTPUT"

      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const encoded = "${{ steps.combine.outputs.results }}";
            const results = Buffer.from(encoded, 'base64').toString('utf8');
            const outcome = "${{ job.status }}";
            const output = `#### Hadolint: \`${outcome}\`\n\n${results}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail on hadolint findings
        if: |
          steps.hl-root.outcome == 'failure' ||
          steps.hl-engine.outcome == 'failure' ||
          steps.hl-audio.outcome == 'failure' ||
          steps.hl-whatsapp.outcome == 'failure' ||
          steps.hl-sms.outcome == 'failure'
        run: echo "hadolint found issues" && exit 1
