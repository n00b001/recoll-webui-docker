name: Build and publish Docker images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel sibling jobs when one runner fails.
      # If GitHub's action resolver returns 5xx for one runner, the other
      # images still publish and you only re-run the failed ones.
      fail-fast: false
      matrix:
        include:
          - image: recoll-webui
            context: .

          - image: recoll-engine
            context: ./recoll-engine

          - image: recoll-audio-worker
            context: ./recoll-audio-worker

          - image: whatsapp-archiver
            context: ./whatsapp-archiver

          - image: sms-processor
            context: ./sms-processor

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
