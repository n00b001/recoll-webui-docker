# =============================================================================
# Recoll Configuration — Unified Search Index
# =============================================================================
# Mount this file to /root/.recoll/recoll.conf inside the container.
#
# Phase 1 (now):     Documents + Images (EXIF)
# Phase 2 (later):   + Audio transcription
# Phase 3 (future):  + WhatsApp, SMS, Email via unified UI
# =============================================================================

# ---------------------------------------------------------------------------
# WHAT TO INDEX
# ---------------------------------------------------------------------------

# All data lives under /homes/ inside the container.
topdirs = /homes/alex/hades /homes/alex/phone /homes/alex/gdrive /homes/alex/gphotos \
          /homes/chloe/home /homes/chloe/phone /homes/chloe/gdrive /homes/chloe/gphotos \
          /homes/mail /homes/whatsapp /homes/sms /homes/transcripts

# Follow symlinks (common in TrueNAS datasets)
followLinks = 1

# ---------------------------------------------------------------------------
# SKIP RULES
# ---------------------------------------------------------------------------

# Don't index these names (build artefacts, caches, the index itself)
skippedNames = #* CVS Cache cache* .cache caughtspam tmp \
    .thumbnails .svn *.rclwe *~ .beagle .git .hg .bzr loop.ps \
    .xsession-errors *.pyc __pycache__ .pytest_cache .tox .direnv \
    .recoll* xapiandb recollrc recoll.conf .DS_Store Thumbs.db \
    @eaDir $RECYCLE.BIN System Volume Information

# Don't index content for these suffixes (names still indexed)
noContentSuffixes = .md5 .map .o .lib .dll .a .sys .exe .com \
    .mpp .mpt .vsd .img .img.gz .image .dat .bak .rdf .log .db \
    .msf .pid ,v ~ #

# Skip common mount points
skippedPaths = /media /tmp

# ---------------------------------------------------------------------------
# INDEX ORGANIZATION
# ---------------------------------------------------------------------------

# Store full document text for better snippets (+10-20% index size)
indexStoreDocText = 1

# English stemming
indexstemminglanguages = english

# Keep case/diacritics stripped (smaller index, sufficient for English)
indexStripChars = 1

# Index filenames even for unsupported types
indexallfilenames = 1

# ---------------------------------------------------------------------------
# SIZE LIMITS
# ---------------------------------------------------------------------------

# Max text file size (skip monster logs). -1 = unlimited.
textfilemaxmbs = 20

# Max compressed file to decompress (100 MB)
compressedfilemaxkbs = 100000

# Page size for text files (helps with large logs)
textfilepagekbs = 1000

# Skip md5 for audio files (expensive, not needed for search)
nomd5types = rclaudio

# ---------------------------------------------------------------------------
# STORAGE
# ---------------------------------------------------------------------------

# Index lives at /root/.recoll/xapiandb
dbdir = xapiandb

# Stop indexing if disk is >90% full
maxfsoccuppc = 90

# Use mtime for change detection (safe on ZFS)
testmodifusemtime = 1
noxattrfields = 1

# ---------------------------------------------------------------------------
# OCR — Tesseract
# ---------------------------------------------------------------------------
# Enables OCR fallback for PDFs and scanned documents.
# When pdftotext returns nothing, recoll runs tesseract on the pages.

ocrprogs = tesseract
tesseractlang = eng

# ---------------------------------------------------------------------------
# IMAGE HANDLING
# ---------------------------------------------------------------------------
# Images are handled by rclimg (exiftool) which extracts EXIF, IPTC, XMP
# metadata — dates, camera info, GPS, descriptions, keywords.
#
# For OCR on standalone photos (JPEG/PNG text extraction), Recoll would
# need a custom handler routing images through tesseract before rclimg.
# Marked as Phase 2 future work.
#
# The mimeconf already maps:
#   image/jpeg = execm rclimg
#   image/png  = execm rclimg
#   image/tiff = execm rclimg
#   image/gif  = execm rclimg
# so no extra config is needed beyond having exiftool installed.

# ---------------------------------------------------------------------------
# AUDIO HANDLING
# ---------------------------------------------------------------------------
# Audio files are handled by rclaudio (uses ffmpeg) which extracts metadata
# and can transcribe audio to text for searching.
#
# The mimeconf already maps:
#   audio/mpeg  = execm rclaudio
#   audio/mp4   = execm rclaudio
#   audio/ogg   = execm rclaudio
#   audio/aac   = execm rclaudio
#   application/x-flac = execm rclaudio
#
# Note: rclaudio extracts metadata tags. Full speech-to-text transcription
# requires an additional pipeline (whisper, etc.) — Phase 3 future work.

# ---------------------------------------------------------------------------
# DOCUMENT HANDLING
# ---------------------------------------------------------------------------
# Documents are handled automatically via the built-in chain:
#   PDF    → pdftotext (poppler) + OCR fallback for scanned pages
#   ODT    → LibreOffice filter
#   DOCX   → LibreOffice filter
#   XLSX   → LibreOffice filter
#   PPTX   → LibreOffice filter
#   TXT    → direct text extraction
#   RTF    → unrtf / catdoc
#   EPUB   → rclepub
# The Docker image ships with all required dependencies.

# ---------------------------------------------------------------------------
# FILENAME INDEXING
# ---------------------------------------------------------------------------

# Index all filenames, even for types we don't process content for
usesystemfilecommand = 1
systemfilecommand = xdg-mime query filetype

# ---------------------------------------------------------------------------
# SUBTREE-SPECIFIC OVERRIDES
# ---------------------------------------------------------------------------

# Phone directories: skip large media caches and app data
[/homes/alex/phone]
skippedNames+ = .cache *.sqlite *.wal *.shm

[/homes/chloe/phone]
skippedNames+ = .cache *.sqlite *.wal *.shm

# Google Photos: skip duplicate sidecar files
[/homes/alex/gphotos]
skippedNames+ = .geo.json .metadata

[/homes/chloe/gphotos]
skippedNames+ = .geo.json .metadata

# Synced email: skip Maildir internal metadata files
[/homes/mail]
skippedNames+ = .syncstate .mbsyncrc uidlist* *.uid

# SMS/RCS organized messages: skip processor state file
[/homes/sms]
skippedNames+ = .processed.json
