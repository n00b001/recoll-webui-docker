[project]
name = "recoll-webui-docker"
version = "0.1.0"
description = "TrueNAS Recoll indexing wrapper with diagnostics and coloured logging"
requires-python = ">=3.14"
dependencies = [
    "pre-commit>=4.6.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[tool.ruff]
exclude = ["recoll-webui/**", "src/**"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "RUF",     # ruff-specific
    "I",       # isort
    "ANN",     # flake8-annotations - type hints required
    "D",       # pydocstyle - docstrings required
    "PL",      # pylint
    "SIM",     # flake8-simplify
    "W",       # pycodestyle warnings
    "A",       # flake8-builtins - ambiguous names
    "BLE",     # flake8-blind-except
]
ignore = [
    "BLE001",  # bare except (explicitly handled in _locked_main)
    "D105",    # no docstring required on magic methods
    "D107",    # no docstring required on __init__
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "S603",    # subprocess popen with shell=True (we use shell=False)
    "S607",    # start process with partial path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103", "S101", "PLC0415", "SIM117", "ANN", "E501"]  # test flexibility

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.pytest.ini_options]
addopts = "-n 4 --dist=load --cov=. --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "__pycache__/*"]
concurrency = ["multiprocessing"]

[tool.coverage.paths]
source = ["recoll_wrapper", ".venv/lib/python3.*/site-packages"]

[tool.coverage.report]
fail_under = 80
show_missing = true
