[project]
name = "recoll-webui-docker"
version = "0.1.0"
description = "TrueNAS Recoll indexing wrapper with diagnostics and coloured logging"
requires-python = ">=3.14"
dependencies = [
    "pre-commit>=4.6.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[tool.ruff]
exclude = ["recoll-webui/**", "src/**"]
